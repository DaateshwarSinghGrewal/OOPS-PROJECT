{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Baithak</title><link rel="stylesheet" href="{% static 'login.css' %}"><link rel="stylesheet" href="{% static 'app.css' %}"></head><body><nav><h2><a href="{% url 'home' %}">Baithak</a></h2><ul><li><a href="{% url 'login' %}">Sign in</a></li></ul></nav><div class="login-container"><h2 class="oval">Baithak</h2><div class="heading"><h3>Create your account</h3><p>Use your Thapar email and student details.</p></div>{% for message in messages %}<p role="alert">{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<div class="input-group"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div><div class="input-group"><label for="email">Thapar email</label><input id="email" name="email" type="email" placeholder="name@thapar.edu" required></div><div class="input-group"><label for="rollno">10-digit roll number</label><input id="rollno" name="rollno" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div><div class="input-group"><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" type="submit">Create account</button><p>Already registered? <a href="{% url 'login' %}">Sign in</a></p></form></div></body></html>
