{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Baithak</title><link rel="stylesheet" href="{% static 'login.css' %}"><link rel="stylesheet" href="{% static 'app.css' %}"></head><body><nav><h2><a href="{% url 'home' %}">Baithak</a></h2><ul><li><a href="{% url 'home' %}">Home</a></li><li><a href="{% url 'register' %}">Register</a></li></ul></nav><div class="login-container"><h2 class="oval">Baithak</h2><div class="heading"><h3>Welcome back</h3><p>Sign in to continue to your account</p></div>{% if error %}<p role="alert" style="color:red">{{ error }}</p>{% endif %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<div class="input-group"><label for="email">Thapar email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="name@thapar.edu" required></div><div class="input-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in</button><p>New to Baithak? <a href="{% url 'register' %}">Create an account</a></p></form></div></body></html>
